<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#EFE6D2">
        <title>레테의 건너편</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #EFE6D2;
                --paper: #FBF6E9;
                --card: #FFFDF6;
                --line: #CBBB96;
                --rule: #8C7A55;
                --green: #1F3A2C;
                --green2: #2F5A44;
                --brown: #7A5316;
                --ink: #2B2218;
                --sub: #5C5040;
                --red: #B5483A;
                --err: #9A3326;
                --gold: #C8962E;
                --track: #E4D8B8;
            }

            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent
            }

            html,body {
                margin: 0;
                background: var(--bg)
            }

            body {
                color: var(--ink);
                font-family: 'Noto Sans KR',system-ui,sans-serif
            }

            #app {
                max-width: 480px;
                margin: 0 auto;
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                background: var(--bg)
            }

            header {
                flex: none;
                height: 56px;
                padding: 0 16px;
                display: flex;
                align-items: center;
                gap: 8px;
                border-bottom: 3px double var(--rule)
            }

            .brand {
                font-family: 'Noto Serif KR',serif;
                font-weight: 700;
                font-size: 20px;
                color: var(--green);
                letter-spacing: .04em
            }

            .ptitle {
                font-family: 'Noto Serif KR',serif;
                font-weight: 700;
                font-size: 18px;
                color: var(--green);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                min-width: 0
            }

            .spacer {
                flex: 1
            }

            .back {
                flex: none;
                width: 44px;
                height: 44px;
                margin-left: -12px;
                border: 0;
                background: transparent;
                font-size: 30px;
                line-height: 1;
                color: var(--green);
                cursor: pointer
            }

            .hstreak {
                flex: none;
                min-height: 34px;
                padding: 0 12px;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                font-weight: 700;
                font-size: 14px;
                color: var(--brown);
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 17px;
                text-decoration: none
            }

            main {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 16px 16px 32px;
                -webkit-overflow-scrolling: touch
            }

            .stack {
                display: flex;
                flex-direction: column;
                gap: 16px
            }

            h1,h2,h3 {
                margin: 0;
                font-family: 'Noto Serif KR',serif;
                color: var(--green)
            }

            h1 {
                font-size: 22px
            }

            h2 {
                font-size: 18px
            }

            h3 {
                font-size: 16px
            }

            .lead {
                margin: 0;
                font-size: 15px;
                line-height: 1.6;
                color: var(--sub)
            }

            .sub {
                font-size: 14px;
                color: var(--sub);
                line-height: 1.5
            }

            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 8px;
                box-shadow: 0 2px 0 var(--line);
                padding: 16px 16px 18px;
                display: flex;
                flex-direction: column;
                gap: 12px
            }

            .paper {
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 8px;
                box-shadow: 0 2px 0 var(--line);
                padding: 18px 16px 22px
            }

            .secthead {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 8px
            }

            .secthead h2 {
                font-size: 17px
            }

            .linkbtn {
                min-height: 44px;
                padding: 0 6px;
                font: 700 14px 'Noto Sans KR',sans-serif;
                color: var(--sub);
                background: transparent;
                border: 0;
                cursor: pointer;
                text-decoration: underline
            }

            .linkbtn.sm {
                min-height: 32px
            }

            .primary {
                width: 100%;
                min-height: 52px;
                font: 700 17px 'Noto Sans KR',sans-serif;
                color: var(--paper);
                background: var(--green);
                border: 1.5px solid var(--green);
                border-radius: 6px;
                cursor: pointer;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .secondary {
                width: 100%;
                min-height: 48px;
                font: 700 16px 'Noto Sans KR',sans-serif;
                color: var(--green);
                background: transparent;
                border: 1.5px solid var(--green);
                border-radius: 6px;
                cursor: pointer;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .primary:disabled,.secondary:disabled {
                opacity: .6;
                cursor: not-allowed
            }

            .danger {
                color: var(--err);
                border-color: var(--err)
            }

            .smallbtn {
                min-height: 44px;
                padding: 0 16px;
                font: 700 14px 'Noto Sans KR',sans-serif;
                color: var(--green);
                background: transparent;
                border: 1.5px solid var(--line);
                border-radius: 6px;
                cursor: pointer;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                justify-content: center
            }

            .smallbtn.danger {
                color: var(--err);
                border-color: var(--err)
            }

            .btnrow {
                display: flex;
                gap: 8px
            }

            .btnrow>* {
                flex: 1
            }

            .msg {
                margin: 0;
                font-size: 15px;
                font-weight: 700;
                line-height: 1.6;
                text-align: center
            }

            .msg.ok {
                color: var(--green)
            }

            .msg.err {
                color: var(--err)
            }

            /* 홈 */
            .hero {
                background: linear-gradient(180deg,#FFFDF6 0%,#F6EDD2 100%)
            }

            .streakrow {
                display: flex;
                align-items: center;
                gap: 14px
            }

            .flame {
                font-size: 44px;
                line-height: 1
            }

            .bigtxt {
                font-family: 'Noto Serif KR',serif;
                font-weight: 700;
                font-size: 28px;
                color: var(--green);
                line-height: 1.2
            }

            .lvrow {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 8px;
                font-size: 14px
            }

            .lvname {
                font-weight: 700;
                color: var(--brown)
            }

            .xp {
                color: var(--sub);
                font-size: 13px
            }

            .pbar {
                height: 10px;
                background: var(--track);
                border-radius: 5px;
                overflow: hidden
            }

            .pbar>span {
                display: block;
                height: 100%;
                background: var(--green2);
                border-radius: 5px
            }

            .pbar.gold>span {
                background: var(--gold)
            }

            .goalrow {
                display: flex;
                align-items: center;
                gap: 16px
            }

            .ring {
                position: relative;
                width: 88px;
                height: 88px;
                flex: none
            }

            .ring svg {
                display: block
            }

            .rtxt {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                line-height: 1.1
            }

            .rtxt b {
                font-size: 22px;
                color: var(--green)
            }

            .rtxt small {
                font-size: 12px;
                color: var(--sub)
            }

            .goalrow .info {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-width: 0
            }

            .week {
                display: flex;
                justify-content: space-between
            }

            .wd {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                width: 13%
            }

            .wd .dot {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 1.5px solid var(--line);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--paper);
                font-weight: 700;
                font-size: 14px
            }

            .wd.on .dot {
                background: var(--green2);
                border-color: var(--green2)
            }

            .wd.today .dot {
                border-color: var(--brown);
                border-width: 2.5px
            }

            .wd.fut {
                opacity: .5
            }

            .wl {
                font-size: 12px;
                color: var(--sub)
            }

            .rowbook {
                display: flex;
                align-items: center;
                gap: 12px
            }

            .rowbook .main {
                flex: 1;
                min-width: 0;
                display: flex;
                align-items: center;
                gap: 12px;
                color: inherit;
                text-decoration: none;
                min-height: 64px
            }

            .rowbook .meta {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 4px
            }

            .btitle {
                font-family: 'Noto Serif KR',serif;
                font-weight: 700;
                font-size: 16px;
                color: var(--green);
                overflow-wrap: anywhere
            }

            .cover {
                position: relative;
                flex: none;
                width: 48px;
                height: 68px;
                border-radius: 3px 6px 6px 3px;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: inset 3px 0 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.25)
            }

            .cover .cl {
                font-family: 'Noto Serif KR',serif;
                font-weight: 700;
                font-size: 22px;
                color: #FBF6E9
            }

            .cover img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover
            }

            .cover.lg {
                width: 96px;
                height: 136px
            }

            .cover.lg .cl {
                font-size: 40px
            }

            .shelf {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                align-items: flex-end;
                padding: 10px 8px 0;
                border-bottom: 6px solid var(--brown);
                background: linear-gradient(180deg,transparent,rgba(122,83,22,.06))
            }

            .spine {
                width: 22px;
                height: 78px;
                border-radius: 2px 2px 0 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #FBF6E9;
                font-size: 10px;
                font-weight: 700;
                overflow: hidden;
                text-decoration: none;
                box-shadow: inset 2px 0 0 rgba(0,0,0,.18)
            }

            .spine span {
                writing-mode: vertical-rl;
                max-height: 70px;
                overflow: hidden;
                white-space: nowrap
            }

            .spine.empty {
                background: transparent;
                border: 1.5px dashed var(--line);
                border-bottom: 0;
                box-shadow: none
            }

            .logcard {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 12px 0;
                border-top: 1px solid var(--track)
            }

            .logcard:first-child {
                border-top: 0;
                padding-top: 0
            }

            .logcard .top {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                font-size: 13px;
                color: var(--sub)
            }

            .logcard .t {
                font-weight: 700;
                color: var(--green);
                font-size: 15px;
                overflow-wrap: anywhere
            }

            .logcard .tags {
                font-size: 13px;
                color: var(--sub)
            }

            .quote {
                margin: 0;
                font-size: 15px;
                line-height: 1.7;
                padding-left: 10px;
                border-left: 3px solid var(--red);
                white-space: pre-wrap;
                overflow-wrap: anywhere
            }

            .acts {
                display: flex;
                gap: 8px;
                justify-content: flex-end
            }

            /* 서재 */
            .field {
                display: flex;
                flex-direction: column;
                gap: 4px
            }

            .label {
                font-size: 14px;
                font-weight: 700;
                color: var(--sub)
            }

            .hint {
                font-size: 13px;
                color: var(--sub);
                line-height: 1.5
            }

            input[type=text],input[type=number],input[type=date],input[type=search],select {
                width: 100%;
                min-height: 48px;
                padding: 8px 2px;
                font: 500 17px 'Noto Sans KR',sans-serif;
                color: var(--ink);
                background: transparent;
                border: 0;
                border-bottom: 1.5px solid var(--rule);
                border-radius: 0;
                -webkit-appearance: none;
                appearance: none
            }

            select {
                background-image: linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
                background-position: calc(100% - 14px) 22px,calc(100% - 9px) 22px;
                background-size: 5px 5px,5px 5px;
                background-repeat: no-repeat;
                padding-right: 28px
            }

            input[type=number] {
                -moz-appearance: textfield
            }

            input::placeholder,textarea::placeholder {
                color: var(--sub);
                opacity: .8
            }

            textarea {
                width: 100%;
                padding: 4px 8px;
                resize: none;
                font: 400 16px/30px 'Noto Sans KR',sans-serif;
                color: var(--ink);
                background-color: transparent;
                background-image: repeating-linear-gradient(transparent,transparent 29px,#D3C39B 29px,#D3C39B 30px);
                background-attachment: local;
                border: 0;
                border-left: 3px solid var(--red);
                border-radius: 0
            }

            .pages {
                display: flex;
                align-items: center;
                gap: 10px
            }

            .pages input {
                flex: 1;
                min-width: 0
            }

            .pages .sep,.pages .unit {
                color: var(--sub)
            }

            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 8px
            }

            .chips.scroll {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 4px
            }

            .chip {
                flex: none;
                min-height: 40px;
                padding: 0 14px;
                font: 500 14px 'Noto Sans KR',sans-serif;
                color: var(--sub);
                background: var(--paper);
                border: 1.5px solid var(--line);
                border-radius: 20px;
                cursor: pointer
            }

            .chip.on {
                color: var(--paper);
                background: var(--green);
                border-color: var(--green);
                font-weight: 700
            }

            .tag {
                display: inline-block;
                padding: 2px 10px;
                font-size: 13px;
                color: var(--brown);
                background: #F1E5C4;
                border-radius: 12px;
                margin: 0 6px 6px 0
            }

            .status {
                display: inline-block;
                padding: 2px 10px;
                font-size: 12px;
                font-weight: 700;
                border-radius: 12px;
                color: var(--paper);
                background: var(--rule)
            }

            .status.reading {
                background: var(--green2)
            }

            .status.done {
                background: var(--brown)
            }

            .status.dropped {
                background: var(--err)
            }

            .stars {
                display: flex;
                gap: 2px
            }

            .stars button {
                width: 44px;
                height: 44px;
                border: 0;
                background: transparent;
                font-size: 30px;
                line-height: 1;
                color: var(--rule);
                cursor: pointer;
                padding: 0
            }

            .stars button.on {
                color: var(--gold)
            }

            .starline {
                color: var(--gold);
                letter-spacing: 1px;
                font-size: 15px
            }

            .bookrow {
                display: flex;
                gap: 12px;
                align-items: stretch;
                color: inherit;
                text-decoration: none;
                min-height: 72px
            }

            .bookrow .meta {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 4px
            }

            .search {
                display: flex;
                gap: 8px
            }

            .search input {
                flex: 1
            }

            .fab {
                min-height: 44px;
                padding: 0 16px;
                font: 700 14px 'Noto Sans KR',sans-serif;
                color: var(--paper);
                background: var(--green);
                border: 0;
                border-radius: 22px;
                cursor: pointer;
                text-decoration: none;
                display: inline-flex;
                align-items: center
            }

            details.sec {
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 8px;
                box-shadow: 0 2px 0 var(--line)
            }

            details.sec>summary {
                list-style: none;
                min-height: 52px;
                padding: 0 16px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-family: 'Noto Serif KR',serif;
                font-weight: 700;
                font-size: 17px;
                color: var(--green);
                cursor: pointer
            }

            details.sec>summary::-webkit-details-marker {
                display: none
            }

            details.sec>summary::after {
                content: '＋';
                font-family: 'Noto Sans KR',sans-serif;
                color: var(--sub)
            }

            details.sec[open]>summary::after {
                content: '－'
            }

            details.sec .body {
                display: flex;
                flex-direction: column;
                gap: 18px;
                padding: 4px 16px 20px
            }

            .toggle {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 48px;
                font-size: 16px;
                cursor: pointer
            }

            .toggle input {
                width: 24px;
                height: 24px;
                accent-color: var(--green)
            }

            .results {
                display: flex;
                flex-direction: column;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: var(--card)
            }

            .results button {
                display: flex;
                gap: 10px;
                align-items: center;
                text-align: left;
                min-height: 72px;
                padding: 8px 10px;
                border: 0;
                border-top: 1px solid var(--track);
                background: transparent;
                font: inherit;
                color: inherit;
                cursor: pointer
            }

            .results button:first-child {
                border-top: 0
            }

            .photoprev {
                max-width: 100%;
                max-height: 260px;
                border-radius: 6px;
                border: 1px solid var(--line);
                object-fit: contain;
                align-self: flex-start
            }

            .seg {
                display: flex;
                background: var(--track);
                border-radius: 8px;
                padding: 3px;
                gap: 3px
            }

            .seg button {
                flex: 1;
                min-height: 44px;
                border: 0;
                border-radius: 6px;
                background: transparent;
                font: 700 14px 'Noto Sans KR',sans-serif;
                color: var(--sub);
                cursor: pointer
            }

            .seg button.on {
                background: var(--card);
                color: var(--green);
                box-shadow: 0 1px 2px rgba(0,0,0,.2)
            }

            dl.info {
                margin: 0;
                display: flex;
                flex-direction: column
            }

            dl.info .r {
                display: flex;
                gap: 12px;
                padding: 10px 0;
                border-top: 1px solid var(--track);
                font-size: 15px;
                line-height: 1.5
            }

            dl.info .r:first-child {
                border-top: 0
            }

            dl.info dt {
                flex: none;
                width: 96px;
                color: var(--sub);
                font-weight: 700;
                font-size: 14px
            }

            dl.info dd {
                margin: 0;
                flex: 1;
                min-width: 0;
                overflow-wrap: anywhere
            }

            .oneline {
                font-family: 'Noto Serif KR',serif;
                font-size: 17px;
                line-height: 1.7;
                color: var(--green);
                margin: 0;
                padding-left: 12px;
                border-left: 3px solid var(--gold)
            }

            .review {
                margin: 0;
                font-size: 15px;
                line-height: 1.8;
                white-space: pre-wrap;
                overflow-wrap: anywhere
            }

            .notecard {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 14px 0;
                border-top: 1px solid var(--track)
            }

            .notecard:first-child {
                border-top: 0
            }

            .notecard .kind {
                font-size: 12px;
                font-weight: 700;
                color: var(--brown)
            }

            .notecard img {
                max-width: 100%;
                border-radius: 6px;
                border: 1px solid var(--line)
            }

            /* 통계 */
            .tiles {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px
            }

            .tile {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 2px
            }

            .tile b {
                font-family: 'Noto Serif KR',serif;
                font-size: 24px;
                color: var(--green)
            }

            .tile span {
                font-size: 13px;
                color: var(--sub)
            }

            .bars {
                display: flex;
                gap: 2px;
                align-items: flex-end;
                padding-top: 20px
            }

            .bcol {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px
            }

            .btrack {
                position: relative;
                width: 100%;
                height: 110px;
                display: flex;
                align-items: flex-end;
                border-bottom: 1.5px solid var(--rule)
            }

            .bar {
                position: relative;
                width: 100%;
                background: var(--green2);
                border-radius: 4px 4px 0 0;
                min-height: 0
            }

            .bar.zero {
                min-height: 2px;
                background: var(--track)
            }

            .bval {
                position: absolute;
                bottom: 100%;
                left: 50%;
                transform: translateX(-50%);
                font-size: 11px;
                font-weight: 700;
                color: var(--ink);
                padding-bottom: 2px;
                white-space: nowrap
            }

            .blab {
                font-size: 11px;
                color: var(--sub)
            }

            .yearnav {
                display: flex;
                align-items: center;
                justify-content: space-between
            }

            .yearnav button {
                width: 44px;
                height: 44px;
                border: 0;
                background: transparent;
                font-size: 24px;
                color: var(--green);
                cursor: pointer

                    href,
                    class: cta ? 'cta' : null,
                    'aria-current': tab === key ? 'page' : null
                }, cta ? h('span', {
                    class: 'circ'
                }, svgIcon(ic, 26)) : svgIcon(ic, 24), h('span', {}, label));
                return h('nav', {
                    'aria-label': '하단 메뉴'
                }, t('home', '#/home', '홈', IC.home), t('shelf', '#/shelf', '서재', IC.shelf), t('read', '#/read', '읽기', IC.pen, true), t('stats', '#/stats', '통계', IC.chart), t('me', '#/me', '성취', IC.trophy));
            }
            let lastRouteKey = '';
            function render() {
                const app = document.getElementById('app')
                  , oldMain = app.querySelector('main');
                const keep = oldMain && lastRouteKey === location.hash ? oldMain.scrollTop : 0;
                const main = h('main', {});
                let page = {
                    title: '',
                    tab: 'home',
                    el: null
                }
                  , showNav = false;
                if (S.fatal)
                    main.append(h('div', {
                        class: 'card'
                    }, h('p', {
                        class: 'msg err',
                        role: 'alert',
                        style: 'text-align:left'
                    }, S.fatal), h('button', {
                        type: 'button',
                        class: 'secondary',
                        onclick: reload
                    }, '다시 불러오기')));
                else if (S.setup)
                    main.append(h('div', {
                        class: 'paper stack'
                    }, h('h1', {}, '데이터 준비가 필요해요'), h('p', {
                        class: 'lead'
                    }, '새 기능에 필요한 표가 아직 만들어지지 않았어요. Supabase의 SQL Editor에서 reading-log4.sql 파일 내용을 한 번 실행한 뒤 아래 버튼을 눌러 주세요. 기존 기록은 그대로 보존됩니다.'), h('button', {
                        type: 'button',
                        class: 'primary',
                        onclick: reload
                    }, '다시 불러오기')));
                else if (!S.ready)
                    main.append(h('p', {
                        class: 'lead',
                        role: 'status'
                    }, '불러오는 중…'));
                else {
                    try {
                        page = routePage();
                    } catch (e) {
                        console.error(e);
                        page = {
                            title: '',
                            tab: 'home',
                            el: h('div', {
                                class: 'card'
                            }, h('p', {
                                class: 'msg err',
                                role: 'alert'
                            }, '화면을 그리지 못했습니다. (' + e.message + ')'), h('a', {
                                class: 'secondary',
                                href: '#/home'
                            }, '홈으로'))
                        };
                    }
                    main.append(page.el);
                    showNav = true;
                }
                const D = S.D
                  , header = h('header', {}, page.back ? h('button', {
                    type: 'button',
                    class: 'back',
                    'aria-label': '뒤로',
                    onclick: () => goBack()
                }, '‹') : null, page.back ? h('span', {
                    class: 'ptitle'
                }, page.title) : h('span', {
                    class: 'brand'
                }, '레테의 건너편'), h('span', {
                    class: 'spacer'
                }), (!page.back && D && D.streak > 0) ? h('a', {
                    class: 'hstreak',
                    href: '#/me',
                    'aria-label': D.streak + '일 연속'
                }, '🔥 ' + D.streak) : null);
                const parts = [header, main];
                if (showNav)
                    parts.push(navEl(page.tab));
                app.replaceChildren(...parts);
                main.scrollTop = keep;
                lastRouteKey = location.hash;
            }
            async function reload() {
                S.ready = false;
                render();
                await loadAll();
                render();
            }

            /* ===== 시작 ===== */
            async function boot() {
                render();
                if (!window.supabase || !window.supabase.createClient) {
                    S.fatal = '연결 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.';
                    S.ready = true;
                    render();
                    return;
                }
                sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: {
                        persistSession: false,
                        autoRefreshToken: false,
                        detectSessionInUrl: false
                    }
                });
                S.D = derive();
                await loadAll();
                render();
            }
            window.addEventListener('hashchange', () => {
                render();
            }
            );
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && S.ready && !S.fatal && !S.setup) {
                    S.D = derive();
                    render();
                }
            }
            );
            boot();
        </script>
    </body>
</html>
